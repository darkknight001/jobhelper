[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; The container has its own network namespace. Only 8095 (dashboard) and 6080 (noVNC) are
; published, on the host's loopback. VNC requires JOBHELPER_VNC_PASSWORD (fails closed without it).

[program:xvfb]
command=Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=sh -c 'test -n "$JOBHELPER_VNC_PASSWORD" && x11vnc -storepasswd "$JOBHELPER_VNC_PASSWORD" /tmp/vncpass >/dev/null 2>&1 && exec x11vnc -display :99 -forever -shared -rfbauth /tmp/vncpass -localhost -rfbport 5911 -quiet'
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5911
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:app]
command=python -m jobhelper serve
directory=/app
priority=40
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
