[project]
name = "jobhelper"
version = "0.1.0"
description = "Personal job discovery, scoring, auto-apply and tracking harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0.36",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pypdf>=5.0",
    "cryptography>=43",
    "playwright>=1.48",
    "claude-agent-sdk>=0.2.170",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
jobhelper = "jobhelper.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobhelper*"]

[tool.setuptools.package-data]
jobhelper = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
